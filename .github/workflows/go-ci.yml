name: Go CI

on:
  workflow_call:
    inputs:
      go-version:
        description: "Go toolchain version"
        type: string
        default: "1.22"
      service-name:
        description: "Name of the service being built"
        type: string
        required: true

jobs:
  ci:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ inputs.go-version }}
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...
